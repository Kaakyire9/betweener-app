global
    maxconn 64
    hard-stop-after 5s

defaults
    mode http
    timeout connect 2s
    timeout http-request 5s
    timeout http-keep-alive 5s
    timeout client 1h
    timeout server 1h

frontend docker_readonly
    bind 0.0.0.0:2375

    acl method_get method GET
    acl origin_form url_beg /
    acl path_allowed path_reg ^(/v[0-9]+\.[0-9]+)?/_ping$ ^(/v[0-9]+\.[0-9]+)?/version$ ^(/v[0-9]+\.[0-9]+)?/events$ ^(/v[0-9]+\.[0-9]+)?/containers/json$ ^(/v[0-9]+\.[0-9]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(json|logs)$

    http-request deny deny_status 405 unless method_get
    http-request deny deny_status 403 unless origin_form path_allowed
    default_backend docker_socket

backend docker_socket
    server docker "${DOCKER_BACKEND}"
