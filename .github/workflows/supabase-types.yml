name: Supabase Types (approved staging read)

on:
  workflow_dispatch:
    inputs:
      confirm_staging_read:
        description: 'Owner approved a read-only type check against Betweener Staging'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types:
    if: ${{ inputs.confirm_staging_read == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Check Generated Types Are Committed
        run: npm run supabase:types:check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: xsgzxadwuxuziubglvps
