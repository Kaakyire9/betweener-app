name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - Testflight

jobs:
  app-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Chat logic tests
        run: npm run test:chat-logic

      - name: Vibes logic tests
        run: npm run test:vibes-logic

      - name: Supabase types drift check
        run: npm run supabase:types:check
