name: Connect native crypto validation

on:
  workflow_dispatch:
    inputs:
      build_ios_artifact:
        description: Build an unsigned iOS XCFramework after native crypto tests pass
        type: boolean
        default: false
        required: true
      build_android_artifact:
        description: Build the Android AAR after the pinned native crypto tests pass
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  macos_crypto:
    name: Pinned native crypto tests and optional iOS artifact
    if: ${{ !inputs.build_android_artifact || inputs.build_ios_artifact }}
    runs-on: macos-26
    concurrency:
      group: connect-native-ios-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      DEPOT_TOOLS_UPDATE: '0'
      DEPOT_TOOLS_METRICS: '0'
      NINJA_CORE_MULTIPLIER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run upstream native red and green tests
        env:
          BUILD_IOS: ${{ inputs.build_ios_artifact }}
        run: |
          set -euo pipefail
          options=(
            --work "$RUNNER_TEMP/connect-webrtc"
            --input "$GITHUB_WORKSPACE/native-patches/stream-webrtc-145.17.0"
            --results "$GITHUB_WORKSPACE/native-results"
            --min-free-gb 12
          )
          if [[ "$BUILD_IOS" == "true" ]]; then options+=(--prepare-ios); fi
          python3 native-patches/stream-webrtc-145.17.0/run-native-tests.py "${options[@]}"

      - name: Build unsigned iOS framework
        if: ${{ inputs.build_ios_artifact }}
        run: |
          set -euo pipefail
          python3 native-patches/stream-webrtc-145.17.0/ios-build.py \
            --work "$RUNNER_TEMP/connect-webrtc" \
            --input "$GITHUB_WORKSPACE/native-patches/stream-webrtc-145.17.0" \
            --results "$GITHUB_WORKSPACE/native-results"

      - name: Retain native test results and optional framework
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-native-crypto-${{ github.run_id }}
          path: native-results/
          if-no-files-found: warn
          retention-days: 7

  android_crypto:
    name: Pinned native crypto tests and Android artifact
    if: ${{ inputs.build_android_artifact }}
    runs-on: ubuntu-24.04
    concurrency:
      group: connect-native-android-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      DEPOT_TOOLS_UPDATE: '0'
      DEPOT_TOOLS_METRICS: '0'
      NINJA_CORE_MULTIPLIER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated Linux build tools and space
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          # Disposable hosted SDKs; Chromium uses its own pinned Android toolchain.
          for directory in /usr/share/dotnet /usr/local/lib/android /opt/ghc; do
            if [[ -d "$directory" ]]; then sudo rm -rf -- "$directory"; fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates git curl python3 python3-venv python3-pip xz-utils unzip \
            bzip2 build-essential pkg-config lsb-release file ninja-build \
            libglib2.0-dev libnss3-dev libnspr4-dev libdbus-1-dev
          df -h "$RUNNER_TEMP"
      - name: Run Linux native red and green tests
        run: |
          set -euo pipefail
          python3 native-patches/stream-webrtc-145.17.0/run-native-tests.py \
            --work "$RUNNER_TEMP/connect-webrtc" \
            --input "$GITHUB_WORKSPACE/native-patches/stream-webrtc-145.17.0" \
            --results "$GITHUB_WORKSPACE/android-native-results" \
            --prepare-android --min-free-gb 30
      - name: Build Android library
        run: |
          set -euo pipefail
          python3 native-patches/stream-webrtc-145.17.0/android-build.py \
            --work "$RUNNER_TEMP/connect-webrtc" \
            --input "$GITHUB_WORKSPACE/native-patches/stream-webrtc-145.17.0" \
            --results "$GITHUB_WORKSPACE/android-native-results"
      - name: Retain Android library and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-native-android-${{ github.run_id }}
          path: android-native-results/
          if-no-files-found: warn
          retention-days: 7
